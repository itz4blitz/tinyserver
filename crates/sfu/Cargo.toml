[package]
name = "sfu"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The headless str0m client in `client.rs`. Tests use it; the server does not.
headless = []
# Entry points for the targets in `fuzz/`. Not for the server.
fuzz = []

[dependencies]
mio = { version = "1", features = ["os-poll", "net"] }
socket2 = "0.6"
# Pinned. str0m breaks its API every few releases; bump on purpose, with the call tests.
str0m = { version = "=0.24.1", default-features = false, features = ["aws-lc-rs"] }
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true

[dev-dependencies]
sfu = { path = ".", features = ["headless"] }
tokio.workspace = true

[lints]
workspace = true
